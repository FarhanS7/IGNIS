services:
  # FastAPI scientific API (read-only NASA PSI fixtures & endpoints)
  - type: web
    name: ignis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENVIRONMENT
        value: production
      - key: NASA_API_KEY
        value: DEMO_KEY
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Static Vite SPA frontend mirror (client-side extractive /ask without Vercel /api/ask)
  - type: web
    name: ignis-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
