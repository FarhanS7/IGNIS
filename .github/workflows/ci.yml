name: CI

on:
  push:
    branches:
      - 'fix/*'
      - 'feature/*'
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run TypeScript unit and parity tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

      - name: Run Grouped Cross-Validation (LOOCV)
        run: python scripts/validate/grouped_loocv.py

      - name: Run QA Benchmark Evaluation
        run: python scripts/validate/eval_qa.py

  e2e:
    name: Playwright E2E Tests
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Build frontend production bundle
        run: npm run build

      - name: Run Playwright E2E test suite
        run: npm run test:e2e --prefix apps/web

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
